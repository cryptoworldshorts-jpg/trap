        .song-item.active { border-color: #198754; background: #14231b; color: #fff; font-weight: bold; }

        .back-home-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: #222; color: #fff; text-decoration: none; border-radius: 8px; border: 1px solid #444; transition: 0.3s; font-size: 0.9rem; }

        .social-links a { text-decoration: none; transition: 0.3s; }
        .social-links a:hover { transform: scale(1.2); }

        .yt { color: #FF0000 !important; } .sp { color: #1DB954 !important; } 
        .fb { color: #4267B2 !important; } .tt { color: #ffffff !important; } .ig { color: #E1306C !important; }

        footer { text-align: center; padding: 40px 0; border-top: 1px solid #222; margin-top: 50px; }

        .related-section { margin-top: 50px; border-top: 1px solid #222; padding-top: 30px; }
        .related-section h3 { margin-bottom: 20px; font-size: 1.2rem; color: #fff; }
        .related-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .related-card { background: #121212; border: 1px solid #333; padding: 18px; border-radius: 12px; text-decoration: none; color: #fff; transition: 0.3s; display: block; text-align: center; }
        .related-card:hover { border-color: #198754; transform: translateY(-3px); }

        @media (max-width: 900px) { .playlist-layout { grid-template-columns: 1fr; } }

    <!-- YOUTUBE IFRAME API SCRIPTE -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // SPISAK ORIENTAL TRAP PJESAMA
        const popFolkPjesme = [
            { naslov: "Zašto", ytId: "cIzHmcER9bs" },
            { naslov: "Ostani Još Malo", ytId: "jqtTkhSzasE" },
            { naslov: "Šta Mi Radiš Milino", ytId: "kw0x-PkO_fg" },
            { naslov: "Nesanice", ytId: "SVB0wALIiDY" },
            { naslov: "Ostao Sam Tamo", ytId: "qUTuxBKvgAw" },
            { naslov: "Zauvjek Lijepa", ytId: "ZXFSaP1bOOs" },
            { naslov: "Budi To Što Jesi", ytId: "WnUkQArHwfo" },
            { naslov: "Dijana Dijana", ytId: "RrxxJS0_OVg" },
            { naslov: "Ako Čuješ Ovu Pjesmu", ytId: "ejOrRfs0Z0I" },
            { naslov: "Da Sam Ja Netko", ytId: "mOUTSt36QcM" },
            { naslov: "Kad Me Ne Bude", ytId: "S-mUHrII120" },
            { naslov: "Udaj Se Za Mene", ytId: "g6TPj1jg2VE" },
            { naslov: "Ovu Noć Ne Dam Nikome", ytId: "15yl94LsZ14" },
            { naslov: "Ko To Mene Zove", ytId: "8_2fCuMLfkU" },
            { naslov: "Ti Si Moje Ljeto", ytId: "-owuWvRnxgE" },
            { naslov: "Bez Tebe Nemam Plan", ytId: "cmMcHzDOuUw" },
            { naslov: "Misli Tvoje Su Moje", ytId: "KTWRwflQQik" },
            { naslov: "Okana Okana", ytId: "ANWRpRvf9kM" }
        ];

        let player = null;
        let trenutniIndex = 0;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: popFolkPjesme[0].ytId,
                playerVars: { 
                    'playsinline': 1, 
                    'autoplay': 1, 
                    'controls': 1 
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady() {
            prikaziPjesmeUListi();
        }

        function onPlayerStateChange(event) {
            // Kada pjesma završi, automatski prelazi na sljedeću
            if (event.data === YT.PlayerState.ENDED) {
                trenutniIndex = (trenutniIndex + 1) % popFolkPjesme.length;
                pustiPjesmuPoIndexu(trenutniIndex);
            }
        }

        function prikaziPjesmeUListi() {
            const container = document.getElementById('song-list-container');
            document.getElementById('song-count-title').innerText = `Pjesme u listi (${popFolkPjesme.length}):`;
            container.innerHTML = '';

            popFolkPjesme.forEach((pjesma, index) => {
                const item = document.createElement('div');
                item.className = 'song-item' + (index === trenutniIndex ? ' active' : '');
                item.innerHTML = `
                    <span>${index + 1}. ${pjesma.naslov}</span>
                    <span class="play-btn-tag"><i class="fas fa-play"></i> PUSTI</span>
                `;
                item.onclick = () => pustiPjesmuPoIndexu(index);
                container.appendChild(item);
            });
        }

        function pustiPjesmuPoIndexu(index) {
            trenutniIndex = index;
            const pjesma = popFolkPjesme[index];

            if (player && typeof player.loadVideoById === 'function') {
                player.loadVideoById(pjesma.ytId);
            }

            // Ažuriraj aktivnu klasu u listi
            const items = document.querySelectorAll('.song-item');
            items.forEach((el, i) => {
                if (i === trenutniIndex) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }
    </script>
